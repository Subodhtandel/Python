{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Patient Registration</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:#0b1220;color:#eaf0f7;padding:28px}
    .card{max-width:720px;margin:18px auto;padding:22px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));box-shadow:0 10px 30px rgba(2,6,23,0.6)}
    h1{margin:0 0 8px 0}
    form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .full{grid-column:1/3}
    label{display:block;font-size:0.9rem;color:#cfe8f0;margin-bottom:6px}
    input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#eaf0f7}
    .btn{grid-column:1/3;padding:12px 16px;border-radius:10px;background:linear-gradient(90deg,#6ee7b7,#7c3aed);color:#07203a;font-weight:700;border:none;cursor:pointer}
    .error{color:#ffb4b4;font-size:0.9rem}
    .hint{font-size:0.85rem;color:#a7c2cc}
  </style>
</head>
<body>
  <div class="card">
    <h1>Patient Registration</h1>
    <p class="hint">All fields validated on client side with JavaScript before submitting.</p>
    <form id="regForm" method="post" novalidate>
      {% csrf_token %}
      <div>
        <label for="first_name">First name</label>
        <input id="first_name" name="first_name" required>
        <div class="error" id="err-first_name"></div>
      </div>

      <div>
        <label for="last_name">Last name</label>
        <input id="last_name" name="last_name" required>
        <div class="error" id="err-last_name"></div>
      </div>

      <div class="full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <div class="error" id="err-email"></div>
      </div>

      <div>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" required>
        <div class="error" id="err-phone"></div>
      </div>

      <div>
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="0" max="120" required>
        <div class="error" id="err-age"></div>
      </div>

      <div class="full">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <div class="error" id="err-password"></div>
      </div>

      <div class="full">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" required>
        <div class="error" id="err-confirm_password"></div>
      </div>

      <button type="submit" class="btn">Register</button>
    </form>
  </div>

  <script src="{% static 'js/validate_email.js' %}"></script>
  <script src="{% static 'js/validate_password.js' %}"></script>
  <script src="{% static 'js/validate_form.js' %}"></script>
</body>
</html>
