{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit profile</h1>
<div class="row">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field.errors }}
              {{ field }}
            </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary">Save</button>
          <a class="btn btn-outline-secondary ms-2" href="{% url 'blog:author_profile' user.username %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
