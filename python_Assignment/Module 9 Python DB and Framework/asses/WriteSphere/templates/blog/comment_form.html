{% extends "base.html" %}
{% block title %}Edit comment{% endblock %}
{% block content %}
<div class="col-lg-8 mx-auto">
  <h1 class="h4 mb-3">Edit comment</h1>
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            {{ field.errors }}
            {{ field }}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-sm">Update</button>
        <a href="{{ object.post.get_absolute_url }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
