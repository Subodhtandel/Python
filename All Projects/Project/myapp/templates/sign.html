<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #243042;
      --error: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1000px 600px at 20% 10%, #1d4ed8 0%, transparent 50%),
                  radial-gradient(800px 500px at 90% 20%, #9333ea 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 18px; color: var(--muted); }

    label { display: block; margin: 12px 0 6px; font-size: 14px; color: var(--text); }
    input {
      width: 100%;
      padding: 12px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,.15); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-hover); }

    .link { color: #93c5fd; text-decoration: none; }
    .link:hover { text-decoration: underline; }

    .error {
      margin-top: 12px;
      color: #fecaca;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 10px 12px;
      border-radius: 10px;
      display: none;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Sign in</h1>
    <p>Welcome back. Please enter your details.</p>

    <form id="signinForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required minlength="6" />

      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;margin:0;">
          <input type="checkbox" id="remember" style="width:auto;" />
          Remember me
        </label>
        <a class="link" href="#" onclick="alert('Hook this up to your reset password page')">
          Forgot password?
        </a>
      </div>

      <button class="btn" type="submit">Sign In</button>

      <div id="errorBox" class="error"></div>

      <div class="footer">
        Don’t have an account?
        <a class="link" href="signup.html">Sign up</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('signinForm');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      errorBox.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      // Example: replace with your API endpoint
      // const res = await fetch('/api/auth/login', { ... })

      // Demo-only validation:
      if (!email.includes('@') || password.length < 6) {
        errorBox.textContent = 'Please enter a valid email and a password of at least 6 characters.';
        errorBox.style.display = 'block';
        return;
      }

      // Store remember preference (optional)
      if (remember) localStorage.setItem('rememberEmail', email);
      else localStorage.removeItem('rememberEmail');

      alert('Signed in (demo). Connect this form to your backend API.');
    });

    // Prefill remembered email
    const remembered = localStorage.getItem('rememberEmail');
    if (remembered) document.getElementById('email').value = remembered;
  </script>
</body>
</html>
